<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receipt Details | SmartPantry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f4f6f1;
      --surface:   #ffffff;
      --mist:      #edf0e9;
      --mist2:     #e4e9df;
      --border:    #d8dfd2;
      --green:     #3d6b4f;
      --green-lt:  #5a8c6a;
      --green-bg:  #eaf2ec;
      --green-pale:#f0f6f2;
      --sage:      #85a882;
      --text-1:    #1c2b1e;
      --text-2:    #546553;
      --text-3:    #93a890;
      --danger:    #b83232;
      --danger-bg: #fdf0f0;
      --danger-bdr:#f0c8c8;
      --warning:   #876200;
      --warning-bg:#fdf7e8;
      --warning-bdr:#e8d89a;
      --success:   #2a6040;
      --success-bg:#eaf4ee;
      --success-bdr:#aed4bb;
      --r:         10px;
      --r-lg:      16px;
      --sans:      'Inter', system-ui, sans-serif;
      --serif:     'Lora', Georgia, serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 58px;
    }

    .nav-brand { display: flex; align-items: center; gap: 8px; }
    .nav-brand .leaf { font-size: 18px; }
    .nav-brand .name {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      color: var(--text-1);
    }

    .btn-back {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-back:hover { background: var(--mist); color: var(--text-1); }
    .btn-back .arr { font-size: 14px; line-height: 1; }

    /* ─── PAGE ─── */
    .page {
      max-width: 940px;
      margin: 0 auto;
      padding: 44px 24px 80px;
    }

    /* ─── PAGE HEADER ─── */
    .page-header { margin-bottom: 32px; }
    .page-header h1 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 500;
      color: var(--text-1);
      line-height: 1.2;
      margin-bottom: 5px;
    }
    .page-header p { font-size: 13px; color: var(--text-3); }

    /* ─── SECTION HEADING ─── */
    .sec-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 14px;
    }
    .sec-head h2 {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 500;
      color: var(--text-1);
    }
    .sec-head span { font-size: 11px; color: var(--text-3); }

    /* ─── TWO COL (summary + meta) ─── */
    .two-col {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      margin-bottom: 36px;
      align-items: start;
    }
    @media (max-width: 680px) { .two-col { grid-template-columns: 1fr; } }

    /* ─── PANEL ─── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }

    .panel-head {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-head h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .panel-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--sage);
      background: var(--green-bg);
      border-radius: 20px;
      padding: 2px 8px;
    }

    /* ─── RECEIPT SUMMARY ROWS ─── */
    #receiptSummary .summary-box {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 18px;
      border-bottom: 1px solid var(--mist);
    }
    #receiptSummary .summary-box:last-child { border-bottom: none; }
    #receiptSummary .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-3);
      margin: 0;
    }
    #receiptSummary .value {
      font-size: 13px;
      color: var(--text-1);
      font-weight: 500;
      margin: 0;
      text-align: right;
      max-width: 58%;
    }

    /* ─── RECEIPT META PILL (store · date) ─── */
    .receipt-meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green-bg);
      border: 1px solid #b8d4be;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--green);
      margin-bottom: 6px;
    }

    /* ─── ITEMS GRID ─── */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    @media (max-width: 580px) { .items-grid { grid-template-columns: 1fr; } }

    /* ─── PRODUCT CARD (JS-injected via initReceiptPage) ─── */
    /* receiptItems is set via innerHTML — each .product-card is injected by script.js */
    #receiptItems .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #receiptItems .product-card h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.3;
      margin: 4px 0 2px;
    }

    #receiptItems .product-card p {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.5;
      margin: 0;
    }

    #receiptItems .product-card p b {
      font-weight: 600;
      color: var(--text-3);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-right: 4px;
    }

    #receiptItems .product-card small {
      font-size: 10px;
      color: var(--text-3);
    }

    /* ─── STATUS BADGES ─── */
    .status-badge {
      display: inline-block;
      padding: 3px 9px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border: 1px solid transparent;
      align-self: flex-start;
      margin-top: 2px;
    }
    .badge-green  { background: var(--success-bg); color: var(--success); border-color: var(--success-bdr); }
    .badge-yellow { background: var(--warning-bg); color: var(--warning); border-color: var(--warning-bdr); }
    .badge-red    { background: var(--danger-bg);  color: var(--danger);  border-color: var(--danger-bdr);  }

    /* ─── EMPTY STATE ─── */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-3);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      grid-column: 1 / -1;
    }
    .empty-state .e-icon { font-size: 24px; opacity: 0.4; }
  </style>
</head>
<body onload="initReceiptPage()">

  <!-- NAV -->
  <nav>
    <div class="nav-brand">
      <span class="leaf">🌿</span>
      <span class="name">SmartPantry</span>
    </div>
    <button class="btn-back" onclick="goBackToDashboard()">
      <span class="arr">←</span> Back
    </button>
  </nav>

  <!-- PAGE -->
  <div class="page">

    <!-- Header -->
    <div class="page-header">
      <h1>Receipt Details</h1>
      <p id="receiptMeta">Loading receipt…</p>
    </div>

    <!-- Summary + store side by side -->
    <div class="sec-head">
      <h2>Receipt Summary</h2>
      <span>Full details from the database</span>
    </div>

    <div style="margin-bottom: 36px;">
      <div class="panel">
        <div class="panel-head">
          <h3>Store Details</h3>
          <span class="panel-tag">Receipt</span>
        </div>
        <div id="receiptSummary">
          <div class="summary-box"><p class="label">Store</p><p class="value">Loading…</p></div>
          <div class="summary-box"><p class="label">Address</p><p class="value">Loading…</p></div>
          <div class="summary-box"><p class="label">Date</p><p class="value">Loading…</p></div>
          <div class="summary-box"><p class="label">Total</p><p class="value">Loading…</p></div>
          <div class="summary-box"><p class="label">Payment</p><p class="value">Loading…</p></div>
        </div>
      </div>
    </div>

    <!-- Items -->
    <div class="sec-head">
      <h2>Items</h2>
      <span>All products saved for this receipt</span>
    </div>

    <div class="items-grid" id="receiptItems">
      <div class="empty-state">
        <div class="e-icon">🥬</div>
        <p>Loading items…</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>

  <!-- Fix receiptItems: script.js sets inline grid style on #receiptItems; override it cleanly -->
  <script>
    window.addEventListener('load', function () {
      const el = document.getElementById('receiptItems');
      if (el) {
        el.removeAttribute('style'); // strip the inline grid from original HTML
      }
    });
  </script>

</body>
</html>
